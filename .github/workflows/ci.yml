name: Tests und Installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - run: node --test tests/npx.test.mjs tests/update.test.mjs
      - run: python scripts/test_all.py
      - run: python scripts/check_public.py
      - run: python scripts/smoke.py
  portal:
    # Playwright 1.56.1 stellt Chromium und Systempakete für Ubuntu 24.04 bereit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm install --prefix "$RUNNER_TEMP/browser" --no-package-lock playwright@1.56.1
      - run: |
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: node --test tests/portal.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
      - run: python -m unittest discover -s tests -p test_persona.py -v
        env:
          NODE_PATH: ${{ runner.temp }}/browser/node_modules
          PERSONA_BROWSER_TEST: '1'
